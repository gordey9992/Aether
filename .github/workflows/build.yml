          package me.gordey9992.aether.listeners;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;
          
          public class JoinListener implements Listener {
              private final Aether plugin = Aether.getInstance();
              private final Set<UUID> firstJoin = new HashSet<>();
              
              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player p = event.getPlayer();
                  
                  if (!firstJoin.contains(p.getUniqueId()) && !p.hasPlayedBefore()) {
                      firstJoin.add(p.getUniqueId());
                      
                      // Give starter kit
                      if (plugin.getConfig().getBoolean("fish.give-on-first-join", true)) {
                          p.getInventory().addItem(new org.bukkit.inventory.ItemStack(org.bukkit.Material.SALMON, 1));
                          p.sendMessage(plugin.getMessageManager().getMessage("fish.give"));
                      }
                      
                      // Give starter money
                      if (plugin.getEconomyManager() != null) {
                          plugin.getEconomyManager().deposit(p.getUniqueId(), plugin.getConfig().getDouble("economy.starting-balance", 100.0));
                      }
                  }
              }
          }
