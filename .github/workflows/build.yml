      - name: Create EconomyManager.java
        run: |
          cat > src/main/java/me/gordey9992/aether/managers/EconomyManager.java << 'JAVAEOF'
          package me.gordey9992.aether.managers;
          
          import me.gordey9992.aether.Aether;
          import java.sql.*;
          import java.util.UUID;
          
          public class EconomyManager {
              private final Aether plugin;
              private final String currencySymbol;
              
              public EconomyManager(Aether plugin) {
                  this.plugin = plugin;
                  this.currencySymbol = plugin.getConfig().getString("economy.currency-symbol", "$");
              }
              
              public double getBalance(UUID uuid) {
                  try (PreparedStatement stmt = plugin.getDatabaseManager().getConnection()
                          .prepareStatement("SELECT balance FROM economy WHERE uuid = ?")) {
                      stmt.setString(1, uuid.toString());
                      ResultSet rs = stmt.executeQuery();
                      if (rs.next()) {
                          return rs.getDouble("balance");
                      } else {
                          setBalance(uuid, plugin.getConfig().getDouble("economy.starting-balance", 100.0));
                          return plugin.getConfig().getDouble("economy.starting-balance", 100.0);
                      }
                  } catch (SQLException e) {
                      e.printStackTrace();
                      return 0;
                  }
              }
              
              public void setBalance(UUID uuid, double amount) {
                  try (PreparedStatement stmt = plugin.getDatabaseManager().getConnection()
                          .prepareStatement("REPLACE INTO economy (uuid, balance) VALUES (?, ?)")) {
                      stmt.setString(1, uuid.toString());
                      stmt.setDouble(2, amount);
                      stmt.executeUpdate();
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
              }
              
              public void deposit(UUID uuid, double amount) {
                  setBalance(uuid, getBalance(uuid) + amount);
              }
              
              public void withdraw(UUID uuid, double amount) {
                  setBalance(uuid, getBalance(uuid) - amount);
              }
              
              public String getCurrencySymbol() { return currencySymbol; }
          }
