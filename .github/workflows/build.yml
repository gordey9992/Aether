      - name: Create DatabaseManager.java
        run: |
          cat > src/main/java/me/gordey9992/aether/managers/DatabaseManager.java << 'JAVAEOF'
          package me.gordey9992.aether.managers;
          
          import me.gordey9992.aether.Aether;
          import java.sql.*;
          
          public class DatabaseManager {
              private final Aether plugin;
              private Connection connection;
              
              public DatabaseManager(Aether plugin) {
                  this.plugin = plugin;
              }
              
              public void init() {
                  try {
                      Class.forName("org.sqlite.JDBC");
                      connection = DriverManager.getConnection("jdbc:sqlite:" + plugin.getDataFolder() + "/database.db");
                      createTables();
                      plugin.getLogger().info("Database connected!");
                  } catch (Exception e) {
                      plugin.getLogger().severe("Database error: " + e.getMessage());
                  }
              }
              
              private void createTables() throws SQLException {
                  // Economy table
                  connection.createStatement().execute(
                      "CREATE TABLE IF NOT EXISTS economy (" +
                      "uuid VARCHAR(36) PRIMARY KEY, " +
                      "balance DOUBLE DEFAULT 100.0)"
                  );
                  
                  // Homes table
                  connection.createStatement().execute(
                      "CREATE TABLE IF NOT EXISTS homes (" +
                      "uuid VARCHAR(36), " +
                      "name VARCHAR(50), " +
                      "world VARCHAR(50), " +
                      "x DOUBLE, y DOUBLE, z DOUBLE, " +
                      "yaw FLOAT, pitch FLOAT, " +
                      "PRIMARY KEY (uuid, name))"
                  );
                  
                  // Warps table
                  connection.createStatement().execute(
                      "CREATE TABLE IF NOT EXISTS warps (" +
                      "name VARCHAR(50) PRIMARY KEY, " +
                      "world VARCHAR(50), " +
                      "x DOUBLE, y DOUBLE, z DOUBLE, " +
                      "yaw FLOAT, pitch FLOAT)"
                  );
              }
              
              public Connection getConnection() { return connection; }
              
              public void close() {
                  try { if (connection != null) connection.close(); }
                  catch (SQLException e) { e.printStackTrace(); }
              }
          }
