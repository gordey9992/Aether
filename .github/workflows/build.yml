      - name: Create KitManager.java
        run: |
          cat > src/main/java/me/gordey9992/aether/managers/KitManager.java << 'JAVAEOF'
          package me.gordey9992.aether.managers;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.Material;
          import org.bukkit.configuration.file.YamlConfiguration;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          
          import java.io.File;
          import java.util.*;
          
          public class KitManager {
              private final Aether plugin;
              private final Map<String, List<ItemStack>> kits = new HashMap<>();
              
              public KitManager(Aether plugin) {
                  this.plugin = plugin;
                  loadKits();
              }
              
              private void loadKits() {
                  File kitsFolder = new File(plugin.getDataFolder(), "kits");
                  if (!kitsFolder.exists()) kitsFolder.mkdirs();
                  
                  File[] files = kitsFolder.listFiles((dir, name) -> name.endsWith(".yml"));
                  if (files != null) {
                      for (File file : files) {
                          String name = file.getName().replace(".yml", "");
                          YamlConfiguration config = YamlConfiguration.loadConfiguration(file);
                          List<ItemStack> items = (List<ItemStack>) config.getList("items", new ArrayList<>());
                          kits.put(name, items);
                      }
                  }
                  
                  // Example kit
                  if (!kits.containsKey("starter")) {
                      List<ItemStack> starterItems = Arrays.asList(
                          new ItemStack(Material.STONE_SWORD),
                          new ItemStack(Material.BREAD, 10)
                      );
                      kits.put("starter", starterItems);
                  }
              }
              
              public void giveKit(Player player, String name) {
                  List<ItemStack> items = kits.get(name);
                  if (items == null) {
                      player.sendMessage("§cКит не найден!");
                      return;
                  }
                  
                  for (ItemStack item : items) {
                      player.getInventory().addItem(item.clone());
                  }
                  player.sendMessage("§aВы получили кит: " + name);
              }
              
              public List<String> getKits() {
                  return new ArrayList<>(kits.keySet());
              }
          }
