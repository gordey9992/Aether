name: AETHER FULL BUILD - All Modules

on:
  workflow_dispatch:

jobs:
  full-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Create directory structure
        run: |
          mkdir -p src/main/java/me/gordey9992/aether/{commands,listeners,managers,web,utils,api,data,guis,hooks,tab,dynamic,music,media,items}
          mkdir -p src/main/java/me/gordey9992/aether/commands/{admin,essentials,teleport,fun,world,economy,moderation}
          mkdir -p src/main/resources/{web,lang,menus,items,sounds,textures}
          mkdir -p src/main/resources/web/{css,js}
      
      - name: Create Aether.java
        run: |
          cat > src/main/java/me/gordey9992/aether/Aether.java << 'JAVAEOF'
          package me.gordey9992.aether;
          
          import me.gordey9992.aether.commands.*;
          import me.gordey9992.aether.commands.admin.*;
          import me.gordey9992.aether.commands.essentials.*;
          import me.gordey9992.aether.commands.teleport.*;
          import me.gordey9992.aether.commands.fun.*;
          import me.gordey9992.aether.commands.world.*;
          import me.gordey9992.aether.commands.economy.*;
          import me.gordey9992.aether.commands.moderation.*;
          import me.gordey9992.aether.listeners.*;
          import me.gordey9992.aether.managers.*;
          import me.gordey9992.aether.tab.TabManager;
          import me.gordey9992.aether.web.WebServer;
          import me.gordey9992.aether.dynamic.DynamicCommandLoader;
          import me.gordey9992.aether.music.AeCD;
          import me.gordey9992.aether.media.AeVI;
          import me.gordey9992.aether.items.AeItem;
          import me.gordey9992.aether.utils.*;
          import org.bukkit.plugin.java.JavaPlugin;
          
          public class Aether extends JavaPlugin {
              private static Aether instance;
              
              // Managers
              private ConfigManager configManager;
              private MessageManager messageManager;
              private DatabaseManager databaseManager;
              private EconomyManager economyManager;
              private HomeManager homeManager;
              private WarpManager warpManager;
              private KitManager kitManager;
              private CooldownManager cooldownManager;
              
              // Modules
              private TabManager tabManager;
              private DynamicCommandLoader dynamicLoader;
              private WebServer webServer;
              private AeCD aeCD;
              private AeVI aeVI;
              private AeItem aeItem;
              
              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  reloadConfig();
                  
                  // Core Managers
                  configManager = new ConfigManager(this);
                  messageManager = new MessageManager(this);
                  cooldownManager = new CooldownManager(this);
                  
                  // Database
                  if (getConfig().getBoolean("database.enabled", true)) {
                      databaseManager = new DatabaseManager(this);
                      databaseManager.init();
                  }
                  
                  // Economy
                  if (getConfig().getBoolean("economy.enabled", true)) {
                      economyManager = new EconomyManager(this);
                  }
                  
                  // Homes & Warps
                  homeManager = new HomeManager(this);
                  warpManager = new WarpManager(this);
                  kitManager = new KitManager(this);
                  
                  // Modules
                  if (getConfig().getBoolean("tab.enabled", true)) {
                      tabManager = new TabManager(this);
                  }
                  
                  if (getConfig().getBoolean("dynamic-commands.enabled", true)) {
                      dynamicLoader = new DynamicCommandLoader(this);
                      dynamicLoader.loadCommands();
                  }
                  
                  if (getConfig().getBoolean("web-editor.enabled", false)) {
                      webServer = new WebServer(
                          getConfig().getInt("web-editor.port", 8080),
                          getConfig().getString("web-editor.password", "admin")
                      );
                      webServer.start();
                  }
                  
                  if (getConfig().getBoolean("aecd.enabled", true)) {
                      aeCD = new AeCD(this);
                  }
                  
                  if (getConfig().getBoolean("aevi.enabled", true)) {
                      aeVI = new AeVI(this);
                  }
                  
                  if (getConfig().getBoolean("aeitem.enabled", true)) {
                      aeItem = new AeItem(this);
                  }
                  
                  // Register all commands
                  registerCommands();
                  
                  // Register listeners
                  registerListeners();
                  
                  getLogger().info("§aAether §fплагин §aзагружен§f!");
                  getLogger().info("§7Экономика: §" + (economyManager != null ? "aВкл" : "cВыкл"));
                  getLogger().info("§7База данных: §" + (databaseManager != null ? "aВкл" : "cВыкл"));
                  getLogger().info("§7Дома/Варпы: §aВкл");
                  getLogger().info("§7AeCD: §" + (aeCD != null ? "aВкл" : "cВыкл"));
                  getLogger().info("§7AeVI: §" + (aeVI != null ? "aВкл" : "cВыкл"));
                  getLogger().info("§7AeItem: §" + (aeItem != null ? "aВкл" : "cВыкл"));
              }
              
              private void registerCommands() {
                  // Economy
                  getCommand("balance").setExecutor(new BalanceCommand());
                  getCommand("pay").setExecutor(new PayCommand());
                  getCommand("baltop").setExecutor(new BaltopCommand());
                  
                  // Homes
                  getCommand("sethome").setExecutor(new SethomeCommand());
                  getCommand("home").setExecutor(new HomeCommand());
                  getCommand("delhome").setExecutor(new DelhomeCommand());
                  getCommand("homes").setExecutor(new HomesCommand());
                  
                  // Warps
                  getCommand("setwarp").setExecutor(new SetwarpCommand());
                  getCommand("warp").setExecutor(new WarpCommand());
                  getCommand("delwarp").setExecutor(new DelwarpCommand());
                  getCommand("warps").setExecutor(new WarpsCommand());
                  
                  // Kits
                  getCommand("kit").setExecutor(new KitCommand());
                  getCommand("kitcreate").setExecutor(new KitcreateCommand());
                  getCommand("kits").setExecutor(new KitsCommand());
                  
                  // Teleport
                  getCommand("tpa").setExecutor(new TpaCommand());
                  getCommand("tpaccept").setExecutor(new TpacceptCommand());
                  getCommand("tpdeny").setExecutor(new TpdenyCommand());
                  getCommand("back").setExecutor(new BackCommand());
                  getCommand("spawn").setExecutor(new SpawnCommand());
                  getCommand("setspawn").setExecutor(new SetspawnCommand());
                  
                  // Essentials
                  getCommand("fly").setExecutor(new FlyCommand());
                  getCommand("gamemode").setExecutor(new GamemodeCommand());
                  getCommand("heal").setExecutor(new HealCommand());
                  getCommand("feed").setExecutor(new FeedCommand());
                  getCommand("god").setExecutor(new GodCommand());
                  getCommand("nick").setExecutor(new NickCommand());
                  getCommand("hat").setExecutor(new HatCommand());
                  getCommand("workbench").setExecutor(new WorkbenchCommand());
                  getCommand("enderchest").setExecutor(new EnderchestCommand());
                  getCommand("repair").setExecutor(new RepairCommand());
                  getCommand("enchant").setExecutor(new EnchantCommand());
                  getCommand("trash").setExecutor(new TrashCommand());
                  getCommand("clear").setExecutor(new ClearCommand());
                  
                  // Fun
                  getCommand("disco").setExecutor(new DiscoCommand());
                  getCommand("rainbow").setExecutor(new RainbowCommand());
                  getCommand("firework").setExecutor(new FireworkCommand());
                  getCommand("smite").setExecutor(new SmiteCommand());
                  
                  // World
                  getCommand("weather").setExecutor(new WeatherCommand());
                  getCommand("time").setExecutor(new TimeCommand());
                  getCommand("day").setExecutor(new DayCommand());
                  getCommand("night").setExecutor(new NightCommand());
                  
                  // Admin
                  getCommand("broadcast").setExecutor(new BroadcastCommand());
                  getCommand("kick").setExecutor(new KickCommand());
                  getCommand("ban").setExecutor(new BanCommand());
                  getCommand("mute").setExecutor(new MuteCommand());
                  getCommand("vanish").setExecutor(new VanishCommand());
                  getCommand("flyall").setExecutor(new FlyallCommand());
                  getCommand("healall").setExecutor(new HealallCommand());
                  getCommand("reload").setExecutor(new ReloadCommand());
                  
                  // Moderation
                  getCommand("warn").setExecutor(new WarnCommand());
                  getCommand("seen").setExecutor(new SeenCommand());
                  getCommand("near").setExecutor(new NearCommand());
                  getCommand("ping").setExecutor(new PingCommand());
                  getCommand("tps").setExecutor(new TpsCommand());
                  
                  // Fish
                  getCommand("fish").setExecutor(new FishCommand());
                  
                  // AeCD
                  getCommand("aecd").setExecutor(new AeCDCommand());
                  
                  // AeVI
                  getCommand("aevi").setExecutor(new AeVICommand());
                  
                  // AeItem
                  getCommand("aeitem").setExecutor(new AeItemCommand());
                  
                  // Script
                  getCommand("script").setExecutor(new ScriptCommand());
                  
                  // Main
                  getCommand("aether").setExecutor(new AetherCommand());
                  getCommand("tab").setExecutor(new TabCommand());
              }
              
              private void registerListeners() {
                  getServer().getPluginManager().registerEvents(new JoinListener(), this);
                  getServer().getPluginManager().registerEvents(new QuitListener(), this);
                  getServer().getPluginManager().registerEvents(new DeathListener(), this);
                  getServer().getPluginManager().registerEvents(new ChatListener(), this);
                  getServer().getPluginManager().registerEvents(new InteractListener(), this);
              }
              
              @Override
              public void onDisable() {
                  if (databaseManager != null) databaseManager.close();
                  if (webServer != null) webServer.stop();
                  getLogger().info("§cAether §fвыгружен§f!");
              }
              
              @Override
              public void reloadConfig() {
                  super.reloadConfig();
                  getConfig().options().copyDefaults(true);
                  saveConfig();
              }
              
              // Getters
              public static Aether getInstance() { return instance; }
              public ConfigManager getConfigManager() { return configManager; }
              public MessageManager getMessageManager() { return messageManager; }
              public DatabaseManager getDatabaseManager() { return databaseManager; }
              public EconomyManager getEconomyManager() { return economyManager; }
              public HomeManager getHomeManager() { return homeManager; }
              public WarpManager getWarpManager() { return warpManager; }
              public KitManager getKitManager() { return kitManager; }
              public CooldownManager getCooldownManager() { return cooldownManager; }
              public AeCD getAeCD() { return aeCD; }
              public AeVI getAeVI() { return aeVI; }
              public AeItem getAeItem() { return aeItem; }
          }
          JAVAEOF
      
