      - name: Create AeCD.java (Music)
        run: |
          cat > src/main/java/me/gordey9992/aether/music/AeCD.java << 'JAVAEOF'
          package me.gordey9992.aether.music;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.Material;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          
          import java.io.File;
          import java.util.HashMap;
          import java.util.Map;
          
          public class AeCD {
              private final Aether plugin;
              private final Map<String, File> discs = new HashMap<>();
              
              public AeCD(Aether plugin) {
                  this.plugin = plugin;
                  File musicFolder = new File(plugin.getDataFolder(), "music");
                  if (!musicFolder.exists()) musicFolder.mkdirs();
                  loadDiscs();
              }
              
              private void loadDiscs() {
                  File musicFolder = new File(plugin.getDataFolder(), "music");
                  File[] files = musicFolder.listFiles((dir, name) -> name.endsWith(".ogg"));
                  if (files != null) {
                      for (File file : files) {
                          String name = file.getName().replace(".ogg", "");
                          discs.put(name, file);
                          plugin.getLogger().info("Loaded disc: " + name);
                      }
                  }
              }
              
              public ItemStack getDisc(String name) {
                  ItemStack disc = new ItemStack(Material.MUSIC_DISC_CAT, 1);
                  ItemMeta meta = disc.getItemMeta();
                  meta.setDisplayName("§b§l" + name);
                  disc.setItemMeta(meta);
                  return disc;
              }
              
              public void playDisc(Player player, String name) {
                  if (!discs.containsKey(name)) {
                      player.sendMessage("§cПластинка не найдена!");
                      return;
                  }
                  player.sendMessage("§a§l🎵 Проигрывается: " + name);
                  player.playSound(player.getLocation(), "custom." + name, 1.0f, 1.0f);
              }
              
              public void giveDisc(Player player, String name) {
                  player.getInventory().addItem(getDisc(name));
                  player.sendMessage("§aВы получили пластинку: " + name);
              }
              
              public Map<String, File> getDiscs() { return discs; }
          }
          JAVAEOF
      
      - name: Create AeVI.java (Video/Image)
        run: |
          cat > src/main/java/me/gordey9992/aether/media/AeVI.java << 'JAVAEOF'
          package me.gordey9992.aether.media;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.Bukkit;
          import org.bukkit.Material;
          import org.bukkit.entity.ItemFrame;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.MapMeta;
          import org.bukkit.map.MapCanvas;
          import org.bukkit.map.MapRenderer;
          import org.bukkit.map.MapView;
          
          import javax.imageio.ImageIO;
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.concurrent.CompletableFuture;
          
          public class AeVI {
              private final Aether plugin;
              private final Map<Integer, BufferedImage> cache = new HashMap<>();
              
              public AeVI(Aether plugin) {
                  this.plugin = plugin;
              }
              
              public void printImage(Player player, String url) {
                  CompletableFuture.supplyAsync(() -> downloadImage(url))
                      .thenAcceptAsync(image -> {
                          if (image != null) {
                              player.getInventory().addItem(createMap(image));
                              player.sendMessage("§aИзображение напечатано на карту!");
                          } else {
                              player.sendMessage("§cНе удалось загрузить изображение!");
                          }
                      });
              }
              
              private BufferedImage downloadImage(String urlString) {
                  try {
                      URL url = new URL(urlString);
                      BufferedImage original = ImageIO.read(url);
                      BufferedImage resized = new BufferedImage(128, 128, BufferedImage.TYPE_INT_ARGB);
                      Graphics2D g = resized.createGraphics();
                      g.drawImage(original, 0, 0, 128, 128, null);
                      g.dispose();
                      return resized;
                  } catch (Exception e) {
                      return null;
                  }
              }
              
              private ItemStack createMap(BufferedImage image) {
                  MapView mapView = Bukkit.createMap(Bukkit.getWorlds().get(0));
                  mapView.getRenderers().clear();
                  mapView.addRenderer(new MapRenderer() {
                      private boolean rendered = false;
                      
                      @Override
                      public void render(MapView map, MapCanvas canvas, Player player) {
                          if (rendered) return;
                          rendered = true;
                          for (int x = 0; x < 128; x++) {
                              for (int y = 0; y < 128; y++) {
                                  Color color = new Color(image.getRGB(x, y), true);
                                  canvas.setPixelColor(x, y, color);
                              }
                          }
                      }
                  });
                  
                  ItemStack item = new ItemStack(Material.FILLED_MAP);
                  MapMeta meta = (MapMeta) item.getItemMeta();
                  meta.setMapView(mapView);
                  item.setItemMeta(meta);
                  return item;
              }
              
              public void createProjector(Player player, ItemFrame frame, String url) {
                  player.sendMessage("§aПроектор создан! (URL: " + url + ")");
              }
          }
