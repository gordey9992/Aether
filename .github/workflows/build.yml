        run: |
          cat > src/main/java/me/gordey9992/aether/commands/FishCommand.java << 'JAVAEOF'
          package me.gordey9992.aether.commands;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.Material;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;
          
          public class FishCommand implements CommandExecutor {
              private final Aether plugin = Aether.getInstance();
              private final Map<UUID, Long> cooldowns = new HashMap<>();
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) {
                      sender.sendMessage(plugin.getMessageManager().getMessage("player-only"));
                      return true;
                  }
                  
                  Player p = (Player) sender;
                  int cooldownHours = plugin.getConfig().getInt("fish.cooldown-hours", 24);
                  long cooldownTime = cooldownHours * 60 * 60 * 1000L;
                  
                  if (cooldowns.containsKey(p.getUniqueId())) {
                      long remaining = cooldowns.get(p.getUniqueId()) + cooldownTime - System.currentTimeMillis();
                      if (remaining > 0) {
                          long hours = remaining / (60 * 60 * 1000);
                          long minutes = (remaining % (60 * 60 * 1000)) / (60 * 1000);
                          p.sendMessage("§cПодождите " + hours + "ч " + minutes + "м до следующей рыбы!");
                          return true;
                      }
                  }
                  
                  ItemStack fish = new ItemStack(Material.SALMON, 1);
                  ItemMeta meta = fish.getItemMeta();
                  meta.setDisplayName(plugin.getConfig().getString("fish.item-name", "&6&lЛещ"));
                  meta.setLore(plugin.getConfig().getStringList("fish.item-lore"));
                  fish.setItemMeta(meta);
                  
                  p.getInventory().addItem(fish);
                  p.sendMessage(plugin.getMessageManager().getMessage("fish.give"));
                  cooldowns.put(p.getUniqueId(), System.currentTimeMillis());
                  return true;
              }
          }
