                  final String name;
                  final Material material;
                  final List<String> lore;
                  final Map<Enchantment, Integer> enchants;
                  final double damage;
                  
                  CustomItem(String id, String name, Material material, List<String> lore, Map<Enchantment, Integer> enchants, double damage) {
                      this.id = id;
                      this.name = name;
                      this.material = material;
                      this.lore = lore;
                      this.enchants = enchants;
                      this.damage = damage;
