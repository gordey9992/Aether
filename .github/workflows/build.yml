      - name: Create Economy files
        run: |
          # BalanceCommand.java
          cat > src/main/java/me/gordey9992/aether/commands/economy/BalanceCommand.java << 'JAVAEOF'
          package me.gordey9992.aether.commands.economy;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.entity.Player;
          
          public class BalanceCommand implements CommandExecutor {
              private final Aether plugin = Aether.getInstance();
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  Player target;
                  if (args.length > 0) {
                      target = plugin.getServer().getPlayer(args[0]);
                      if (target == null) {
                          sender.sendMessage("§cИгрок не найден!");
                          return true;
                      }
                  } else if (sender instanceof Player) {
                      target = (Player) sender;
                  } else {
                      sender.sendMessage("§cУкажите игрока!");
                      return true;
                  }
                  
                  double balance = plugin.getEconomyManager().getBalance(target.getUniqueId());
                  sender.sendMessage("§6Баланс §e" + target.getName() + "§6: §a" + balance + " " + plugin.getEconomyManager().getCurrencySymbol());
                  return true;
              }
          }
          JAVAEOF
          
          # PayCommand.java
          cat > src/main/java/me/gordey9992/aether/commands/economy/PayCommand.java << 'JAVAEOF'
          package me.gordey9992.aether.commands.economy;
          
          import me.gordey9992.aether.Aether;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.entity.Player;
          
          public class PayCommand implements CommandExecutor {
              private final Aether plugin = Aether.getInstance();
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) {
                      sender.sendMessage("§cТолько для игроков!");
                      return true;
                  }
                  
                  if (args.length < 2) {
                      sender.sendMessage("§cИспользование: /pay <игрок> <сумма>");
                      return true;
                  }
                  
                  Player from = (Player) sender;
                  Player to = plugin.getServer().getPlayer(args[0]);
                  if (to == null) {
                      sender.sendMessage("§cИгрок не найден!");
                      return true;
                  }
                  
                  double amount;
                  try {
                      amount = Double.parseDouble(args[1]);
                  } catch (NumberFormatException e) {
                      sender.sendMessage("§cНеверная сумма!");
                      return true;
                  }
                  
                  if (plugin.getEconomyManager().getBalance(from.getUniqueId()) < amount) {
                      sender.sendMessage("§cНедостаточно средств!");
                      return true;
                  }
                  
                  plugin.getEconomyManager().withdraw(from.getUniqueId(), amount);
                  plugin.getEconomyManager().deposit(to.getUniqueId(), amount);
                  
                  from.sendMessage("§aВы перевели §e" + amount + " " + plugin.getEconomyManager().getCurrencySymbol() + " §aигроку §e" + to.getName());
                  to.sendMessage("§aИгрок §e" + from.getName() + " §aперевел вам §e" + amount + " " + plugin.getEconomyManager().getCurrencySymbol());
                  return true;
              }
          }
          JAVAEOF
      
