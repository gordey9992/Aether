              private final Aether plugin;
              
              public HomeManager(Aether plugin) {
                  this.plugin = plugin;
              }
              
              public void setHome(UUID uuid, String name, Location loc) {
                  try (PreparedStatement stmt = plugin.getDatabaseManager().getConnection()
                          .prepareStatement("REPLACE INTO homes (uuid, name, world, x, y, z, yaw, pitch) VALUES (?, ?, ?, ?, ?, ?, ?, ?)")) {
                      stmt.setString(1, uuid.toString());
                      stmt.setString(2, name);
                      stmt.setString(3, loc.getWorld().getName());
                      stmt.setDouble(4, loc.getX());
                      stmt.setDouble(5, loc.getY());
                      stmt.setDouble(6, loc.getZ());
                      stmt.setFloat(7, loc.getYaw());
                      stmt.setFloat(8, loc.getPitch());
                      stmt.executeUpdate();
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
              }
              
              public Location getHome(UUID uuid, String name) {
                  try (PreparedStatement stmt = plugin.getDatabaseManager().getConnection()
                          .prepareStatement("SELECT * FROM homes WHERE uuid = ? AND name = ?")) {
                      stmt.setString(1, uuid.toString());
                      stmt.setString(2, name);
                      ResultSet rs = stmt.executeQuery();
                      if (rs.next()) {
                          World world = Bukkit.getWorld(rs.getString("world"));
                          return new Location(
                              world, rs.getDouble("x"), rs.getDouble("y"), rs.getDouble("z"),
                              rs.getFloat("yaw"), rs.getFloat("pitch")
                          );
                      }
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
                  return null;
              }
              
              public List<String> getHomes(UUID uuid) {
                  List<String> homes = new ArrayList<>();
                  try (PreparedStatement stmt = plugin.getDatabaseManager().getConnection()
                          .prepareStatement("SELECT name FROM homes WHERE uuid = ?")) {
                      stmt.setString(1, uuid.toString());
                      ResultSet rs = stmt.executeQuery();
                      while (rs.next()) {
                          homes.add(rs.getString("name"));
                      }
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
                  return homes;
              }
          }
